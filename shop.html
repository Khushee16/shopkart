<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShopKart — browse the full catalog of everyday tech. Filter by category, search, and sort by price or rating." />
  <title>Shop — ShopKart</title>
  <!--
    NOTE: The PHP backend (checkout.php / products.php) runs on a PHP host,
    NOT on GitHub Pages. On Pages this site is static-only: the catalog falls
    back to the built-in data in products.js and checkout shows a labelled
    demo state. See README.md for the PHP and Node.js run instructions.
  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">
  <header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          ShopKart
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="shop.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            <li class="nav-item ms-md-2">
              <button class="btn btn-outline-primary cart-btn" id="cartBtn" aria-label="Open cart">
                Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" id="cartCount">0</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="pt-4 pb-2">
      <h1 class="fs-2">Shop all products</h1>
      <p class="text-muted-custom">Filter by category, search by name, or sort by price and rating.</p>
    </section>

    <section class="controls d-flex flex-wrap gap-3 justify-content-between align-items-center" aria-label="Product filters">
      <div class="d-flex flex-wrap gap-2" id="catPills" role="group" aria-label="Filter by category"></div>
      <div class="d-flex gap-2 flex-wrap">
        <input type="search" id="searchInput" class="form-control" style="max-width: 220px" placeholder="Search products…" aria-label="Search products" />
        <select id="sortSelect" class="form-select" style="max-width: 210px" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating-desc">Top rated</option>
        </select>
      </div>
    </section>

    <p class="text-muted-custom small mt-3 mb-3" id="resultCount" aria-live="polite"></p>
    <section class="row g-4 pb-2" id="grid" aria-label="Products"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="mb-1">ShopKart &middot; A demo storefront &middot; Photos via picsum.photos &middot; No real orders are processed</p>
      <p class="mb-0"><small id="dataSourceNote">Loading catalog…</small></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
