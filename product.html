<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShopKart — product details. Read the full description, pick a quantity, and add to cart." />
  <title>Product — ShopKart</title>
  <!--
    NOTE: The PHP backend (checkout.php / products.php) runs on a PHP host,
    NOT on GitHub Pages. On Pages this site is static-only: the catalog falls
    back to the built-in data in products.js and checkout shows a labelled
    demo state. See README.md for the PHP and Node.js run instructions.
  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="product">
  <header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          ShopKart
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            <li class="nav-item ms-md-2">
              <button class="btn btn-outline-primary cart-btn" id="cartBtn" aria-label="Open cart">
                Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" id="cartCount">0</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <nav aria-label="Breadcrumb" class="pt-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="shop.html">Shop</a></li>
        <li class="breadcrumb-item active" aria-current="page">Product</li>
      </ol>
    </nav>

    <section id="productDetail" class="pt-2" aria-label="Product details"></section>

    <section class="mt-5" id="relatedSection" aria-label="Related products" hidden>
      <div class="section-head reveal">
        <h2>You may also like</h2>
        <a href="shop.html" class="btn btn-link p-0">View all →</a>
      </div>
      <div class="row g-4 mt-1" id="relatedGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="mb-1">ShopKart &middot; A demo storefront &middot; Photos via picsum.photos &middot; No real orders are processed</p>
      <p class="mb-0"><small id="dataSourceNote">Loading catalog…</small></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
